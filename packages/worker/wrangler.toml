name = "privedge-worker"
main = "src/index.ts"
compatibility_date = "2024-06-01"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "PRIVEDGE_KEYS"
id = "5adc9737ef5a4978a380e024d374fef3"

# ─── Dev environment ──────────────────────────────────────────────────────────
# Deploy with: wrangler deploy --env dev
# NEVER deploy with --env dev to the production worker (privedge-worker).
# The PRIVEDGE_DEV_LOGS binding and DEV_LOGGING=true flag MUST NOT exist in
# the production environment. When active, raw prompt content (after
# anonymization) and model responses are stored in KV with a 7-day TTL.
# Remove DEV_LOGGING secret and this binding before any compliance audit.
[env.dev]
name = "privedge-worker-dev"

[[env.dev.kv_namespaces]]
binding = "PRIVEDGE_KEYS"
id = "5adc9737ef5a4978a380e024d374fef3"

[[env.dev.kv_namespaces]]
binding = "PRIVEDGE_DEV_LOGS"
id = "d7a001a8834d43cea88545d79e8f3d31"

[vars]
OPENAI_BASE_URL = "https://api.openai.com"                 # legacy/self-host fallback when AI Gateway is unset
PII_STRATEGY = "anonymize"                                 # "anonymize" | "edge" — self-host override
EDGE_MODEL   = "@cf/meta/llama-3.3-70b-instruct-fp8-fast" # Workers AI model for edge inference
CF_ACCOUNT_ID     = "be8b0bb801637b8d0d45d411d42f1881"    # AI Gateway account id
CF_AIG_GATEWAY_ID = "privedge"                             # AI Gateway gateway slug

# Secrets (set via: wrangler secret put <NAME>)
# WEBHOOK_SECRET         → Stripe webhook signing secret
# RESEND_API_KEY         → Resend transactional email
# SUPABASE_SERVICE_KEY   → Supabase service role key
# SUPABASE_URL           → Supabase project URL
# CLOUD_API_KEY          → Legacy/self-host LLM provider key (fallback when AI Gateway is unset)
# CF_AIG_TOKEN           → AI Gateway authorization token (cf-aig-authorization)
# PROVIDER_KEY_OPENAI    → Managed-mode OpenAI key (Privedge's own)
# PROVIDER_KEY_ANTHROPIC → Managed-mode Anthropic key
# PROVIDER_KEY_GOOGLE    → Managed-mode Google AI Studio key
# PROVIDER_KEY_DEEPSEEK  → Managed-mode DeepSeek key
# PROVIDER_KEY_MISTRAL   → Managed-mode Mistral key
