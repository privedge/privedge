[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privedge"
version = "0.1.0"
description = "Privacy on the edge — drop-in AI proxy client with automatic PII routing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Privedge" }]
keywords = ["ai", "privacy", "edge", "openai", "pii", "compliance", "hipaa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[project.urls]
Homepage = "https://privedge.io"
Repository = "https://github.com/privedge/privedge"

[tool.hatch.build.targets.wheel]
packages = ["privedge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
