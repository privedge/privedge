[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privedge"
version = "1.0.1"
description = "Privacy on the edge — drop-in AI proxy client with automatic PII routing"
readme = "README.md"
# PEP 639: an SPDX string, not the deprecated { text = ... } table.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Privedge" }]
keywords = ["ai", "privacy", "edge", "openai", "pii", "compliance", "hipaa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  # No "License ::" classifier: it is mutually exclusive with the SPDX `license` field.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[project.urls]
Homepage = "https://privedge.io"
Repository = "https://github.com/privedge/privedge"
Issues = "https://github.com/privedge/privedge/issues"

[tool.hatch.build.targets.wheel]
packages = ["privedge"]
# py.typed ships the inline type hints to consumers (PEP 561); without it the
# "Typing :: Typed" classifier is a claim type checkers cannot act on.
artifacts = ["privedge/py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
