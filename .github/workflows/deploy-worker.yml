name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'packages/worker/**'

# Minimum permissions — read source, nothing else.
# Secrets are NOT exposed to PRs from forks (GitHub default).
# NEVER add pull_request trigger here — forks must go through PR review first.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter worker install

      - name: Deploy
        working-directory: packages/worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
